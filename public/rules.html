<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compliance Rules - Compliance Monitoring System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Compliance Monitor</div>
        <div class="brand-sub">Rules Library</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <div class="nav-item" onclick="window.location.href='/dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Overview
      </div>
      <div class="nav-item" onclick="window.location.href='/transactions.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        Transactions
      </div>
      <div class="nav-item" onclick="window.location.href='/alerts.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        Alerts
      </div>
      <div class="nav-item active" onclick="window.location.href='/rules.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 3h6l1 2h4v16H4V5h4l1-2z"/>
          <path d="M8 11h8M8 15h6"/>
        </svg>
        Rules
      </div>
      <div id="adminNav" style="display:none">
        <div class="nav-section-label">Administration</div>
        <div class="nav-item" onclick="window.location.href='/simulator.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Simulator
        </div>
        <div class="nav-item" onclick="window.location.href='/create-user.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          Manage Users
        </div>
      </div>

      <div class="nav-section-label">Account</div>
      <div class="nav-item" onclick="window.location.href='/account.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        My Account
      </div>
    </nav>

    <div class="sidebar-user">
      <div class="sidebar-user-info">
        <div class="sidebar-avatar" id="sidebarAvatar">-</div>
        <div>
          <div class="user-name" id="sidebarName">-</div>
          <div class="user-role" id="sidebarRole">-</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <h2 id="sectionTitle">Compliance Rules</h2>
      <div class="topbar-right">
        <div class="topbar-user">
          <span id="topbarRole" class="badge"></span>
          <span class="user-name" id="topbarName">-</span>
        </div>
      </div>
    </div>

    <div class="content-area">
      <div class="card">
        <div class="card-header">
          <h3>Existing Rules</h3>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="ruleSearch" class="search-input" type="text" placeholder="Search rules..." oninput="renderRules()" />
          </div>
          <div class="risk-filter-group">
            <button type="button" class="filter-chip active" data-status="all" onclick="setStatusFilter('all', this)">All</button>
            <button type="button" class="filter-chip" data-status="active" onclick="setStatusFilter('active', this)">Active</button>
            <button type="button" class="filter-chip" data-status="inactive" onclick="setStatusFilter('inactive', this)">Inactive</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Rule</th>
                <th>Type</th>
                <th>Threshold</th>
                <th>Window</th>
                <th>Points</th>
                <th>Status</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody id="rulesBody">
              <tr><td colspan="8"><div class="empty-state"><p>Loading...</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
const user = requireAuth();
if (!user) throw new Error("not authenticated");
if (user.first_login) window.location.href = "/change-password.html";

document.getElementById("sidebarName").textContent = user.name;
document.getElementById("sidebarRole").textContent = user.role;
document.getElementById("sidebarAvatar").textContent = user.name.charAt(0).toUpperCase();
document.getElementById("topbarName").textContent = user.name;
const roleEl = document.getElementById("topbarRole");
roleEl.textContent = user.role;
roleEl.className = `badge badge-${user.role}`;
if (["admin", "compliance_manager"].includes(user.role)) document.getElementById("adminNav").style.display = "block";

let rules = [];
let statusFilter = "all";

function formatDate(value) {
  if (!value) return "-";
  return new Date(value).toLocaleString("en-SG", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function formatThreshold(rule) {
  const parts = [];
  if (rule.threshold_value !== null && rule.threshold_value !== undefined) {
    parts.push(`Value ${Number(rule.threshold_value).toLocaleString("en-SG")}`);
  }
  if (rule.threshold_count !== null && rule.threshold_count !== undefined) {
    parts.push(`Count ${rule.threshold_count}`);
  }
  return parts.length ? parts.join(" / ") : "-";
}

function statusPill(isActive) {
  return isActive
    ? '<span class="pill pill-normal">Active</span>'
    : '<span class="pill pill-pending">Inactive</span>';
}

function setStatusFilter(filter, button) {
  statusFilter = filter;
  document.querySelectorAll(".filter-chip").forEach((chip) => chip.classList.remove("active"));
  button.classList.add("active");
  renderRules();
}

function renderRules() {
  const q = document.getElementById("ruleSearch").value.trim().toLowerCase();
  const body = document.getElementById("rulesBody");
  const filtered = rules.filter((rule) => {
    const active = Number(rule.is_active) === 1;
    const matchesStatus =
      statusFilter === "all" ||
      (statusFilter === "active" && active) ||
      (statusFilter === "inactive" && !active);
    const searchable = `${rule.rule_id} ${rule.rule_name || ""} ${rule.rule_type || ""} ${rule.description || ""}`.toLowerCase();
    return matchesStatus && searchable.includes(q);
  });

  if (!filtered.length) {
    body.innerHTML = '<tr><td colspan="8"><div class="empty-state"><p>No rules found.</p></div></td></tr>';
    return;
  }

  body.innerHTML = filtered.map((rule) => `
    <tr>
      <td style="font-family:monospace;color:var(--text-muted)">${rule.rule_id}</td>
      <td>
        <div style="font-weight:700">${rule.rule_name || "-"}</div>
        <div style="color:var(--text-muted);font-size:12px;max-width:420px">${rule.description || "-"}</div>
      </td>
      <td>${rule.rule_type || "-"}</td>
      <td>${formatThreshold(rule)}</td>
      <td>${rule.time_window_minutes ? `${rule.time_window_minutes} min` : "-"}</td>
      <td style="font-weight:700">${rule.points || 0}</td>
      <td>${statusPill(Number(rule.is_active) === 1)}</td>
      <td style="color:var(--text-muted);font-size:12px">${formatDate(rule.updated_at || rule.created_at)}</td>
    </tr>
  `).join("");
}

async function loadRules() {
  const res = await apiFetch("/api/rules");
  if (!res) return;
  if (!res.ok) {
    document.getElementById("rulesBody").innerHTML =
      '<tr><td colspan="8"><div class="empty-state"><p>Unable to load rules.</p></div></td></tr>';
    return;
  }
  rules = await res.json();
  renderRules();
}

loadRules();
</script>
</body>
</html>
